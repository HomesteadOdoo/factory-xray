name: Deploy Factory X-Ray

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Static integrity check
        shell: bash
        run: |
          set -euo pipefail
          for asset in public/index.html public/app.js public/styles.css public/routes.js public/enhancements.js public/enhancements.css public/geography.js public/geography.css public/kpis.js public/system-insights.js; do
            test -s "$asset" || { echo "Missing/empty dashboard asset: $asset"; exit 1; }
          done
          grep -q 'id="nav"' public/index.html
          grep -q 'factory-dashboard-api' public/app.js
          grep -q 'leaflet@1.9.4' public/index.html
          grep -q 'routes.js' public/index.html
          grep -q 'kpis.js' public/index.html
          grep -q 'system-insights.js' public/index.html
          grep -q 'L.map' public/enhancements.js
          grep -q 'fxMapPanel' public/enhancements.js

          # Every required dashboard route must exist in the navigation registry.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" public/app.js || { echo "Missing dashboard view: ${view}"; exit 1; }
          done

          # Detail/drill-down support must remain present for core CRM entities.
          grep -q "companies:'company'" public/app.js
          grep -q "facilities:'facility'" public/app.js
          grep -q "opportunities:'opportunity'" public/app.js
          grep -q "contacts:'contact'" public/app.js
          grep -q "projects:'project'" public/app.js
          grep -q 'detailHash' public/enhancements.js
          grep -q 'bindRelatedDrilldowns' public/enhancements.js

          # Frontend must never contain Supabase service-role credentials or JWT-like secret material.
          if grep -Eqi 'service[_-]?role|SUPABASE_SERVICE_ROLE|eyJ[a-zA-Z0-9_-]{20,}' public/*.html public/*.js public/*.css; then
            echo 'Potential privileged credential material detected in public assets.'
            exit 1
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live dashboard
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl_live() {
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$1" -o "$2"
          }
          for asset in index.html app.js styles.css routes.js enhancements.js enhancements.css geography.js geography.css kpis.js system-insights.js; do
            curl_live "${base}${asset/index.html/}" "/tmp/${asset}"
          done

          grep -q 'Factory X-Ray' /tmp/index.html
          grep -q 'factory-dashboard-api' /tmp/app.js
          grep -q 'leaflet@1.9.4' /tmp/index.html
          grep -q 'routes.js' /tmp/index.html
          grep -q 'kpis.js' /tmp/index.html
          grep -q 'system-insights.js' /tmp/index.html
          grep -q 'L.map' /tmp/enhancements.js
          grep -q 'fxMapPanel' /tmp/enhancements.js

          # Confirm every required route shipped to the live artifact.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" /tmp/app.js || { echo "Live artifact missing view: ${view}"; exit 1; }
          done

          # Confirm drill-down and map functionality shipped with the live artifact.
          grep -q 'detailHash' /tmp/enhancements.js
          grep -q 'bindRelatedDrilldowns' /tmp/enhancements.js

          # Edge API must be reachable but protected when called without auth.
          api_code="$(curl --silent --output /tmp/api.json --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 3 'https://ycdrdcawvvspzilmzgjy.supabase.co/functions/v1/factory-dashboard-api')"
          test "$api_code" = "401"
          grep -qi 'unauthorized' /tmp/api.json
          echo "Live dashboard, all critical assets, map/drill-down code, complete navigation registry, and protected Edge API are reachable."
