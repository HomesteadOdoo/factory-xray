name: Deploy Factory X-Ray

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Static integrity check
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          grep -q 'id="nav"' public/index.html
          grep -q 'factory-dashboard-api' public/app.js

          # Every required dashboard route must exist in the navigation registry.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" public/app.js || { echo "Missing dashboard view: ${view}"; exit 1; }
          done

          # Detail/drill-down support must remain present for core CRM entities.
          grep -q "companies:'company'" public/app.js
          grep -q "facilities:'facility'" public/app.js
          grep -q "opportunities:'opportunity'" public/app.js
          grep -q "contacts:'contact'" public/app.js
          grep -q "projects:'project'" public/app.js

          # Frontend must never contain Supabase service-role credentials.
          if grep -Eqi 'service[_-]?role|SUPABASE_SERVICE_ROLE|eyJ[a-zA-Z0-9_-]{20,}' public/index.html public/app.js public/styles.css; then
            echo 'Potential privileged credential material detected in public assets.'
            exit 1
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live dashboard
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}" -o /tmp/index.html
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}app.js" -o /tmp/app.js
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}styles.css" -o /tmp/styles.css
          grep -q 'Factory X-Ray' /tmp/index.html
          grep -q 'factory-dashboard-api' /tmp/app.js
          test -s /tmp/styles.css

          # Confirm every required route shipped to the live artifact.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" /tmp/app.js || { echo "Live artifact missing view: ${view}"; exit 1; }
          done

          # Edge API must be reachable but protected when called without auth.
          api_code="$(curl --silent --output /tmp/api.json --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 3 'https://ycdrdcawvvspzilmzgjy.supabase.co/functions/v1/factory-dashboard-api')"
          test "$api_code" = "401"
          grep -q 'unauthorized' /tmp/api.json
          echo "Live dashboard, complete navigation registry, and protected Edge API are reachable."
