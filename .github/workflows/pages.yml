name: Deploy Factory X-Ray

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Static integrity check
        shell: bash
        run: |
          set -euo pipefail
          for asset in public/index.html public/app.js public/styles.css public/routes.js public/enhancements.js public/enhancements.css public/geography.js public/geography.css public/kpis.js public/system-insights.js public/health-check.js public/build-version.txt; do
            test -s "$asset" || { echo "Missing/empty dashboard asset: $asset"; exit 1; }
          done

          # Catch browser-breaking JavaScript syntax errors before deployment.
          for js in public/app.js public/routes.js public/enhancements.js public/geography.js public/kpis.js public/system-insights.js public/health-check.js; do
            node --check "$js"
          done

          grep -q 'id="nav"' public/index.html
          grep -q 'factory-dashboard-api' public/app.js
          grep -q 'leaflet@1.9.4' public/index.html
          grep -q 'routes.js' public/index.html
          grep -q 'kpis.js' public/index.html
          grep -q 'system-insights.js' public/index.html
          grep -q 'health-check.js' public/index.html
          grep -q 'L.map' public/enhancements.js
          grep -q 'fxMapPanel' public/enhancements.js
          grep -q "const VIEWS = \['overview'" public/health-check.js

          # Every required dashboard route must exist in the navigation registry.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" public/app.js || { echo "Missing dashboard view: ${view}"; exit 1; }
          done

          # Every static in-dashboard hash link must point to a registered view.
          python3 - <<'PY'
          import re
          from pathlib import Path
          app = Path('public/app.js').read_text()
          html = Path('public/index.html').read_text()
          match = re.search(r"const views = \[(.*?)\]\n\nconst tableConfig", app, re.S)
          if not match:
              raise SystemExit('Could not locate dashboard views registry')
          views = set(re.findall(r"\['([a-z][a-z0-9_-]*)','", match.group(1)))
          links = set(re.findall(r'href="#([a-z][a-z0-9_-]*)"', html))
          missing = sorted(links - views)
          if missing:
              raise SystemExit(f'Unregistered static dashboard links: {missing}')
          print(f'Validated {len(links)} static dashboard hash links against {len(views)} registered views.')
          PY

          # Detail/drill-down support must remain present for core CRM entities.
          grep -q "companies:'company'" public/app.js
          grep -q "facilities:'facility'" public/app.js
          grep -q "opportunities:'opportunity'" public/app.js
          grep -q "contacts:'contact'" public/app.js
          grep -q "projects:'project'" public/app.js
          grep -q 'detailHash' public/enhancements.js
          grep -q 'bindRelatedDrilldowns' public/enhancements.js

          # CRM writes must not pretend to succeed until an authenticated write API exists.
          grep -q 'disabled title="Güvenli write endpoint hazırlanıyor"' public/app.js
          grep -q 'disabled title="Güvenli authenticated write endpoint hazırlanıyor"' public/app.js

          # Frontend must never contain Supabase service-role credentials or JWT-like secret material.
          if grep -Eqi 'service[_-]?role|SUPABASE_SERVICE_ROLE|eyJ[a-zA-Z0-9_-]{20,}' public/*.html public/*.js public/*.css; then
            echo 'Potential privileged credential material detected in public assets.'
            exit 1
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify live dashboard
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          curl_live() {
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$1" -o "$2"
          }
          for asset in index.html app.js styles.css routes.js enhancements.js enhancements.css geography.js geography.css kpis.js system-insights.js health-check.js build-version.txt; do
            curl_live "${base}${asset/index.html/}" "/tmp/${asset}"
          done

          grep -q 'Factory X-Ray' /tmp/index.html
          grep -q 'factory-dashboard-api' /tmp/app.js
          grep -q 'leaflet@1.9.4' /tmp/index.html
          grep -q 'routes.js' /tmp/index.html
          grep -q 'kpis.js' /tmp/index.html
          grep -q 'system-insights.js' /tmp/index.html
          grep -q 'health-check.js' /tmp/index.html
          grep -q 'L.map' /tmp/enhancements.js
          grep -q 'fxMapPanel' /tmp/enhancements.js
          grep -q "const VIEWS = \['overview'" /tmp/health-check.js

          # Verify the actually deployed JavaScript parses successfully too.
          for js in /tmp/app.js /tmp/routes.js /tmp/enhancements.js /tmp/geography.js /tmp/kpis.js /tmp/system-insights.js /tmp/health-check.js; do
            node --check "$js"
          done

          # Confirm every required route shipped to the live artifact.
          for view in overview companies facilities geography sectors map opportunities pipeline contacts activities tasks proposals projects signals evidence sources coverage ingest quality health; do
            grep -q "\['${view}'" /tmp/app.js || { echo "Live artifact missing view: ${view}"; exit 1; }
          done

          # Confirm drill-down, map and health self-test functionality shipped with the live artifact.
          grep -q 'detailHash' /tmp/enhancements.js
          grep -q 'bindRelatedDrilldowns' /tmp/enhancements.js
          grep -q '20/20 OK' /tmp/health-check.js

          api='https://ycdrdcawvvspzilmzgjy.supabase.co/functions/v1/factory-dashboard-api'

          # Edge API must be reachable but protected when called without auth.
          api_code="$(curl --silent --output /tmp/api.json --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 3 "$api")"
          test "$api_code" = "401"
          grep -qi 'unauthorized' /tmp/api.json

          # Browser preflight must permit the dashboard's Basic Authorization GET request.
          cors_code="$(curl --silent --show-error --output /dev/null --dump-header /tmp/api-options.headers --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://homesteadodoo.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            "$api")"
          test "$cors_code" = "204"
          grep -Eqi '^access-control-allow-origin:[[:space:]]*\*' /tmp/api-options.headers
          grep -Eqi '^access-control-allow-methods:.*GET' /tmp/api-options.headers
          grep -Eqi '^access-control-allow-headers:.*authorization' /tmp/api-options.headers

          echo "Live dashboard assets parse successfully; navigation/drill-down/health checks are present; protected Edge API and browser CORS preflight are healthy."
